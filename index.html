<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>moment</title>

<style>

body{
  margin:0;
  height:100vh;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;

  font-family: Arial, sans-serif;
  background:#050505;
  color:white;
}

.container{
  text-align:center;
}

/* English */
#text{
  font-size:18px;
  min-height:100px;
}

/*  FORCE SHOW ARABIC */
#special{
  font-size:60px;
  margin-top:20px;

  color:white;

  /*   */
  display:block !important;
  visibility:visible !important;
  opacity:1 !important;
}

/* final */
#final{
  margin-top:20px;
  font-size:14px;
  opacity:1;
}

</style>
</head>

<body>

<div class="container">

  <div id="text"></div>

  <!--  HARD FIX (no animation, no fonts, no SVG) -->
  <div id="special"> </div>

  <div id="final"></div>

</div>

<script>

const textEl = document.getElementById("text");
const finalEl = document.getElementById("final");

const intro = [
"eat properly...",
"rest more...",
"please stop being so hard on yourself...",
"you really need to—"
];

const middle = [
"and somehow...",
"that was the only part I couldn’t move past.",
"",
"and honestly, I got a bit lost in my words after that...",
"",
"not because I was ignoring anything you said...",
"but because that single phrase—' '—just hit differently.",
"",
"it didn’t feel like a word… it felt like interruption."
];

const finalLines = [
"this isn’t me ignoring anything you feel… it’s the opposite.",
"it’s why I couldn’t even keep my words straight.",
"because it genuinely mattered more than I expected."
];

function delay(ms){
  return new Promise(r => setTimeout(r, ms));
}

async function show(lines){
  for(let line of lines){
    textEl.innerHTML = line;
    await delay(800);
  }
}

async function start(){

  await show(intro);

  textEl.innerHTML = "";

  await show(middle);

  textEl.innerHTML = "";

  for(let line of finalLines){
    finalEl.innerHTML += line + "<br/>";
    await delay(800);
  }

  //  DEBUG CONFIRMATION
  console.log("Arabic should be visible now:", document.getElementById("special").innerText);
}

start();

</script>

</body>
</html>
