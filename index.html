<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>moment</title>

<style>

body{
  margin:0;
  height:100vh;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;

  font-family: system-ui, Arial, sans-serif;
  color:white;
  background:#050505;
}

.heartbeat-bg{
  position:absolute;
  inset:-40%;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,0.015),
    transparent
  );
  animation:move 14s linear infinite;
  transform:rotate(8deg);
}

@keyframes move{
  from{transform:translateX(-30%) rotate(8deg)}
  to{transform:translateX(30%) rotate(8deg)}
}

.container{
  width:72%;
  max-width:800px;
  text-align:center;
}

#text{
  height:60vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:18px;
  line-height:2.2;
}

#special{
  font-size:58px;
  opacity:0;
  transition:1.5s ease;
  font-family: Tahoma, Arial, sans-serif;
}

#final{
  margin-top:20px;
  font-size:15px;
  opacity:0;
  transition:2s ease;
}

.glitch{
  animation:glitch .25s;
}

@keyframes glitch{
  0%{transform:translate(0)}
  50%{transform:translate(0.6px,0)}
  100%{transform:translate(0)}
}

</style>
</head>

<body>

<div class="heartbeat-bg"></div>

<div class="container">
  <div id="text"></div>
  <div id="special"> </div>
  <div id="final"></div>
</div>

<script>

const textEl = document.getElementById("text");
const specialEl = document.getElementById("special");
const finalEl = document.getElementById("final");

const intro = [
"eat properly...",
"rest more...",
"please stop being so hard on yourself...",
"you really need to—"
];

const middle = [
"and somehow...",
"that was the only part I couldn’t move past.",
"and honestly, I got a bit lost in my words after that...",
"not because I was ignoring anything you said...",
"but because that single phrase—",
" ",
"it didn’t feel like a word… it felt like interruption."
];

const finalLines = [
"this isn’t me ignoring anything you feel… it’s the opposite.",
"it’s why I couldn’t even keep my words straight.",
"because it genuinely mattered more than I expected."
];

function delay(ms){
  return new Promise(r => setTimeout(r, ms));
}

/*  FIX: Arabic is rendered as full line */
async function showLines(lines, speed=30){

  for(let line of lines){

    textEl.innerHTML = "";

    if (/[\u0600-\u06FF]/.test(line)) {
      textEl.innerHTML = line; // Arabic safe render
      await delay(900);
      continue;
    }

    for(let char of line){
      textEl.innerHTML += char;
      await delay(speed);
    }

    await delay(600);
  }
}

async function start(){

  for(let line of intro){
    textEl.innerHTML = line;
    await delay(800);
  }

  document.body.classList.add("glitch");
  await delay(800);

  for(let line of middle){
    textEl.innerHTML = line;
    await delay(800);
  }

  textEl.innerHTML = "";

  specialEl.style.opacity = 1;

  await delay(1200);

  for(let line of finalLines){
    finalEl.innerHTML += line + "<br/>";
    await delay(800);
  }
}

start();

</script>

</body>
</html>
